<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06060c">
<title>日本國物語 薩摩の焔</title>
<meta name="description" content="日本國物語 第一弾。幕末〜明治の鹿児島を舞台にした史実ベースのドットRPG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/style.css?v=9">
</head>
<body>
<div id="wrap">
  <div id="topbar"><span class="tb-t">日本國物語<b>薩摩の焔</b></span><span id="tbInfo"></span></div>
  <div id="padL" class="padside">
    <div id="stick"><div id="dpad"><i class="arw u"></i><i class="arw r"></i><i class="arw d"></i><i class="arw l"></i><div id="stickKnob"></div></div></div>
  </div>
  <div id="holder">
    <div id="screen">
      <canvas id="cv" width="512" height="384"></canvas>
      <div id="tint"></div>
      <div id="ui"></div>
      <canvas id="mini" width="96" height="96"></canvas>
      <div id="fade"></div>
    </div>
  </div>
  <div id="pad">
    <div class="sticky" id="stickSlot"></div>
    <div id="btns">
      <div class="row small">
        <button data-k="menu">メニュー</button><button data-k="map">地図</button><button data-k="log">ログ</button><button data-k="set">設定</button>
      </div>
      <div class="row ab">
        <button data-k="cancel" class="b">B<small>戻る/走る</small></button>
        <button data-k="ok" class="a">A<small>決定</small></button>
      </div>
      <div class="row small">
        <button data-k="auto">AUTO</button><button data-k="speed">×1</button>
      </div>
    </div>
  </div>
</div>
<script src="../common/audio.js?v=9"></script>
<script src="../common/gfx.js?v=9"></script>
<script src="src/data.js?v=9"></script>

<script src="src/story3.js?v=9"></script>
<script src="src/maps.js?v=9"></script>

</html>
