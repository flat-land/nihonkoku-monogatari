<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>薩摩の焔</title>
<meta name="description" content="幕末〜明治の鹿児島を舞台にした史実ベースのドットRPG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="holder">
    <div id="screen">
      <canvas id="cv" width="384" height="288"></canvas>
      <div id="tint"></div>
      <div id="ui"></div>
      <div id="fade"></div>
    </div>
  </div>
  <div id="pad">
    <div class="dpad">
      <button data-k="up" class="u">▲</button>
      <button data-k="left" class="l">◀</button>
      <button data-k="right" class="r">▶</button>
      <button data-k="down" class="d">▼</button>
    </div>
    <div class="ab">
      <button data-k="cancel" class="b">戻る</button>
      <button data-k="ok" class="a">決定</button>
    </div>
  </div>
</div>
<script src="src/gfx.js"></script>
<script src="src/data.js"></script>
<script src="src/engine.js"></script>
<script src="src/story.js"></script>
<script src="src/maps.js"></script>
</body>
</html>
